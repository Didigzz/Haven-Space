<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Description Generation Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      .test-container {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      button {
        background: #1e90ff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #006edc;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      textarea {
        width: 100%;
        min-height: 100px;
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      .result {
        background: white;
        padding: 15px;
        border-radius: 4px;
        margin-top: 15px;
        border-left: 4px solid #1e90ff;
      }
      .error {
        background: #ffebee;
        color: #c62828;
        padding: 15px;
        border-radius: 4px;
        margin-top: 15px;
      }
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin-right: 10px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .property-details {
        background: white;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .property-field {
        margin-bottom: 10px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>AI Description Generation Test</h1>
    <p>This page tests the AI description generation functionality.</p>

    <div class="test-container">
      <h2>Test Configuration</h2>
      <div class="property-details">
        <div class="property-field">
          <label for="property-name">Property Name</label>
          <input
            type="text"
            id="property-name"
            value="Cozy Boarding House"
            placeholder="Enter property name"
          />
        </div>

        <div class="property-field">
          <label for="property-type">Property Type</label>
          <select id="property-type">
            <option value="house">House</option>
            <option value="apartment">Apartment</option>
            <option value="condo">Condo</option>
            <option value="dormitory">Dormitory</option>
          </select>
        </div>

        <div class="property-field">
          <label for="property-price">Monthly Rent (₱)</label>
          <input type="number" id="property-price" value="8000" placeholder="Enter rent amount" />
        </div>

        <div class="property-field">
          <label for="property-rooms">Rooms Available</label>
          <input type="number" id="property-rooms" value="5" placeholder="Enter number of rooms" />
        </div>

        <div class="property-field">
          <label for="property-capacity">Capacity</label>
          <select id="property-capacity">
            <option value="1-2">1-2 persons per room</option>
            <option value="2-3">2-3 persons per room</option>
            <option value="3+">3+ persons per room</option>
          </select>
        </div>

        <div class="property-field">
          <label for="property-address">Address</label>
          <input
            type="text"
            id="property-address"
            value="123 Main Street, Manila"
            placeholder="Enter address"
          />
        </div>

        <div class="property-field">
          <label for="property-city">City</label>
          <input type="text" id="property-city" value="Manila" placeholder="Enter city" />
        </div>

        <div class="property-field">
          <label for="property-province">Province</label>
          <input
            type="text"
            id="property-province"
            value="Metro Manila"
            placeholder="Enter province"
          />
        </div>
      </div>

      <button id="test-ai-btn">🤖 Test AI Description Generation</button>
      <button id="clear-btn" style="background: #666; margin-left: 10px">Clear Result</button>
    </div>

    <div id="result-container"></div>

    <script type="module">
      import CONFIG from './js/config.ts';
      import AIService from './js/services/AIService.ts';

      console.log('=== AI Test Page ===');
      console.log('CONFIG:', CONFIG);
      console.log('AIService available:', !!AIService);

      const testBtn = document.getElementById('test-ai-btn');
      const clearBtn = document.getElementById('clear-btn');
      const resultContainer = document.getElementById('result-container');

      // Test AI generation
      testBtn.addEventListener('click', async () => {
        try {
          testBtn.disabled = true;
          testBtn.innerHTML = '<span class="loading"></span>Generating...';

          // Get property details from form
          const propertyDetails = {
            property_name: document.getElementById('property-name').value,
            property_type: document.getElementById('property-type').value,
            property_type_other: '',
            price: document.getElementById('property-price').value,
            deposit: '2000',
            rooms_available: document.getElementById('property-rooms').value,
            capacity: document.getElementById('property-capacity').value,
            capacity_custom: '',
            address: document.getElementById('property-address').value,
            city: document.getElementById('property-city').value,
            province: document.getElementById('property-province').value,
            amenities: ['wifi', 'kitchen', 'laundry'],
          };

          console.log('Calling AIService.generateDescription with:', propertyDetails);

          const result = await AIService.generateDescription(propertyDetails);

          console.log('AI Response:', result);

          // Display result
          displayResult(result);
        } catch (error) {
          console.error('Error:', error);
          displayError(error.message || 'Unknown error occurred');
        } finally {
          testBtn.disabled = false;
          testBtn.textContent = '🤖 Test AI Description Generation';
        }
      });

      // Clear result
      clearBtn.addEventListener('click', () => {
        resultContainer.innerHTML = '';
      });

      function displayResult(result) {
        resultContainer.innerHTML = '';

        if (result.success && result.description) {
          const resultDiv = document.createElement('div');
          resultDiv.className = 'result';
          resultDiv.innerHTML = `
                    <h3>✅ Success!</h3>
                    <p><strong>Model Used:</strong> ${result.model_used || 'unknown'}</p>
                    <p><strong>Description:</strong></p>
                    <p style="white-space: pre-wrap;">${result.description}</p>
                    <p><small>Response time: ${new Date().toLocaleTimeString()}</small></p>
                `;
          resultContainer.appendChild(resultDiv);
        } else {
          displayError(result.error || 'No description generated');
        }
      }

      function displayError(message) {
        resultContainer.innerHTML = '';

        const errorDiv = document.createElement('div');
        errorDiv.className = 'error';
        errorDiv.innerHTML = `
                <h3>❌ Error</h3>
                <p>${message}</p>
                <p><small>Check browser console for details (F12)</small></p>
            `;
        resultContainer.appendChild(errorDiv);
      }

      // Check if AIService is working
      console.log('AIService methods:', Object.keys(AIService));
    </script>
  </body>
</html>
