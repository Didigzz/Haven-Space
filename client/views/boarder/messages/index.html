<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
    <title>Messages - Haven Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../css/global.css?v=1777136032299" />
    <link rel="stylesheet" href="../../../css/components/sidebar.css?v=1777136032299" />
    <link rel="stylesheet" href="../../../css/components/navbar.css?v=1777136032299" />
    <link rel="stylesheet" href="../../../css/views/boarder/boarder.css?v=1777136032299" />
    <link rel="stylesheet" href="../../../css/views/boarder/boarder-messages.css?v=1777136032299" />
  </head>
  <body data-view="boarder" data-dashboard-type="boarder">
    <div class="boarder-dashboard">
      <!-- Sidebar Container -->
      <div id="sidebar-container"></div>

      <!-- Main Content -->
      <main class="boarder-main">
        <!-- Content Wrapper -->
        <div class="boarder-content">
          <!-- Messages Page Layout -->
          <div class="messages-container">
            <!-- Messages Sidebar - Conversation List -->
            <div class="messages-sidebar">
              <div class="messages-sidebar-header">
                <h1>Messages</h1>
              </div>

              <!-- Search Messages -->
              <div class="messages-search">
                <div class="messages-search-input-wrapper">
                  <img src="../../../assets/svg/search.svg" alt="search" width="20" height="20" />
                  <input
                    type="text"
                    class="messages-search-input"
                    placeholder="Search messages..."
                    id="messages-search-input"
                  />
                </div>
              </div>

              <!-- Conversation List -->
              <div class="conversations-list" id="conversations-list">
                <div class="empty-conversations">Loading conversations...</div>
              </div>
            </div>

            <!-- Messages Main - Chat Area -->
            <div class="messages-main">
              <!-- Chat Header -->
              <div class="chat-header">
                <div class="chat-header-info">
                  <div class="chat-avatar">
                    <img src="../../../assets/images/default-avatar.png" alt="Avatar" />
                  </div>
                  <div class="chat-header-text">
                    <h2 class="chat-name">Select a conversation</h2>
                    <span class="chat-status">
                      Select a message from the list to start chatting
                    </span>
                  </div>
                </div>
                <div class="chat-header-actions"></div>
              </div>

              <!-- Chat Messages -->
              <div class="chat-messages" id="chat-messages">
                <div class="empty-messages">Select a conversation to view messages</div>
              </div>

              <!-- Chat Input -->
              <div class="chat-input-container">
                <button class="chat-input-btn chat-attach-btn" aria-label="Attach file">
                  <img
                    src="../../../assets/svg/document.svg"
                    alt="paperClip"
                    width="20"
                    height="20"
                  />
                </button>
                <div class="chat-input-wrapper">
                  <input
                    type="text"
                    class="chat-input"
                    placeholder="Type a message..."
                    id="chat-input"
                    autocomplete="off"
                  />
                  <button class="chat-input-btn chat-emoji-btn" aria-label="Emoji">
                    <img
                      src="../../../assets/svg/magnifier.svg"
                      alt="magnifyingGlassPlus"
                      width="20"
                      height="20"
                    />
                  </button>
                </div>
                <button
                  class="chat-input-btn chat-send-btn"
                  id="chat-send-btn"
                  aria-label="Send message"
                >
                  <img
                    src="../../../assets/svg/chevron-right.svg"
                    alt="arrowRightSimple"
                    width="20"
                    height="20"
                  />
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="../../../js/main.ts?v=1777136032299"></script>
    <script type="module" src="../../../js/views/boarder/messages.ts?v=1777136032299"></script>
  </body>
</html>
